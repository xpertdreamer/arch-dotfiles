font_size 16.0
adjust_line_height -2
adjust_column_width 0
font_family Iosevka Nerd Font
italic_font Iosevka Nerd Font Italic

disable_ligatures never
text_composition_strategy platform

detect_urls yes
url_style curly
open_url_with default

scrollback_lines 100000
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 2.0

cursor_shape block
shell_integration no-cursor
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0
cursor            #ffffff
cursor_text_color #181818

background            #181818
foreground            #e4e4ef
selection_background  #453d41
selection_foreground  #e4e4ef

color0  #181818   # bg
color1  #f43841   # red
color2  #73c936   # green
color3  #ffdd33   # yellow
color4  #96a6c8   # niagara (blue)
color5  #9e95c7   # wisteria (magenta)
color6  #95a99f   # quartz (cyan)
color7  #e4e4ef   # fg

color8  #52494e   # bg+4
color9  #ff4f58   # red+1
color10 #73c936   # green
color11 #ffdd33   # yellow
color12 #96a6c8   # niagara
color13 #9e95c7   # wisteria
color14 #95a99f   # quartz
color15 #f5f5f5   # fg+2
